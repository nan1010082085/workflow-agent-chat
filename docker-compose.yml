name: workflow-agent-chat

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-workflow_agent_chat}
      MYSQL_USER: ${MYSQL_USER:-workflow_chat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    volumes:
      - workflow-agent-chat-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  chat-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-workflow_agent_chat}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${MYSQL_USER:-workflow_chat}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      CHAT_CORS_ORIGINS: ${CHAT_CORS_ORIGINS:-*}
      RUNTIME_BASE_URL: ${RUNTIME_BASE_URL:?RUNTIME_BASE_URL must be set}
      RUNTIME_WORKFLOW_KEY: ${RUNTIME_WORKFLOW_KEY:-}
      RUNTIME_INTERNAL_TOKEN: ${RUNTIME_INTERNAL_TOKEN:-}
      RUNTIME_MOCK_ENABLED: ${RUNTIME_MOCK_ENABLED:-false}
      CHAT_UPLOAD_ROOT: /data/agentChat
      CHAT_RATE_LIMIT_ENABLED: ${CHAT_RATE_LIMIT_ENABLED:-true}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    volumes:
      - ${CHAT_UPLOAD_HOST_PATH:-/home/ubuntu/payflow/agentChat}:/data/agentChat
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator-lite/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 12

  chat-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHAT_PORT:-5301}:80"
    depends_on:
      chat-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health | grep -q '^ok$'"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  workflow-agent-chat-mysql:
